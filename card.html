<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your CVS Card</title>
<style>
  :root{--bg:#050208;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--green:#3fb950;--pink:#ff5f8e;--gold:#fbbf24}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:radial-gradient(800px 400px at 50% -10%,rgba(255,95,142,.12),transparent 60%),var(--bg);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem}
  .wrap{max-width:400px;width:100%}
  h1{font-size:1rem;font-weight:700;text-align:center;margin-bottom:4px}
  .sub{color:var(--dim);font-size:.7rem;text-align:center;margin-bottom:1.2rem}
  .balance-hero{background:linear-gradient(135deg,rgba(59,185,80,.08),rgba(255,255,255,.02));
    border:1px solid rgba(59,185,80,.18);border-radius:16px;padding:1.4rem 1.2rem;text-align:center;margin-bottom:1rem}
  .balance-hero .amt{font-size:2.8rem;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
  .balance-hero .lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-top:4px}
  .card-info{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem}
  .card-info .row{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .card-info .row:last-child{border-bottom:none}
  .card-info .k{color:var(--dim);font-size:.72rem}
  .card-info .v{font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
  .btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.9rem;
    border-radius:12px;border:none;font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:.7rem;
    text-decoration:none;transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn-wallet{background:linear-gradient(135deg,#1a4a2e,#0d2818);color:var(--green);border:1px solid rgba(59,185,80,.3)}
  .btn-cvs{background:linear-gradient(135deg,#4a1a1e,#280d10);color:#ff8fa0;border:1px solid rgba(248,81,73,.3)}
  .btn small{display:block;font-size:.6rem;font-weight:400;opacity:.7}
  .err{text-align:center;padding:3rem 1rem;color:var(--dim);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>💳 Your CVS ExtraCare Card</h1>
  <div class="sub">Ready to use at any CVS register</div>
  <div id="content"></div>
</div>
<script>
(function(){
  var p = {};
  (location.hash||'').replace(/^#/,'').split('&').forEach(function(kv){
    var i = kv.indexOf('='); if(i>0) p[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1));
  });
  var card = (p.c||'').replace(/\D/g,'');
  var barcode = (p.b||'').replace(/\D/g,'');
  var balance = parseFloat(p.bl||'0') || 0;
  var since = p.s || '';
  if(card.length !== 9 || barcode.length !== 13){
    document.getElementById('content').innerHTML =
      '<div class="err">⚠️ Card link invalid — part of it may have been cut off.</div>';
    return;
  }
  var walletUrl = 'https://ricefarmer01.github.io/extracare-card/#b=' + barcode + '&o=' + balance.toFixed(2) + '&s=0.00';
  document.getElementById('content').innerHTML = `
    <div class="balance-hero">
      <div class="amt">$${balance.toFixed(2)}</div>
      <div class="lbl">available in ExtraBucks</div>
    </div>
    <div class="card-info">
      <div class="row"><span class="k">Card Number</span><span class="v">${card}</span></div>
      <div class="row"><span class="k">Barcode</span><span class="v">${barcode}</span></div>
      ${since ? `<div class="row"><span class="k">Member Since</span><span class="v">${since}</span></div>` : ''}
    </div>
    <a class="btn btn-wallet" href="${walletUrl}" target="_blank" rel="noopener">
      📱 Show Wallet Card
      <small>Opens the scannable card — show this at checkout</small>
    </a>
    ${p.cv ? `<a class="btn btn-cvs" href="${p.cv}" target="_blank" rel="noopener">
      🔗 View on CVS.com
      <small>See full coupon list and deals</small>
    </a>` : ''}
  `;
})();
</script>
</body>
</html>
