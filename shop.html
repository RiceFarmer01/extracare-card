<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ExtraCare Shop</title>
<style>
  :root{--bg:#0a0a0f;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--green:#3fb950;--red:#f85149;--gold:#fbbf24;--pink:#ff5f8e;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding-bottom:100px}
  .container{max-width:480px;margin:0 auto;padding:12px 12px 100px}
  h1{font-size:1.1rem;font-weight:700;text-align:center;padding:14px 0 4px;letter-spacing:-.01em}
  .sub{text-align:center;color:var(--dim);font-size:.75rem;margin-bottom:12px}
  .summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
  .stat .v{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .l{font-size:.6rem;text-transform:uppercase;color:var(--dim);letter-spacing:.08em;margin-top:2px}
  .sort-bar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .sort-bar::-webkit-scrollbar{display:none}
  .sort-btn{flex-shrink:0;background:var(--card);border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:6px 12px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s}
  .sort-btn.active{border-color:var(--pink);color:var(--pink)}
  .sort-btn:active{transform:scale(.95)}
  .card-row{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:all .15s}
  .card-row:active{transform:scale(.98)}
  .card-row.sold{opacity:.35}
  .card-row.top .balance{color:var(--gold);text-shadow:0 0 12px rgba(251,191,36,.3)}
  .cr-main{display:flex;align-items:center;padding:12px 14px;gap:12px;cursor:pointer}
  .balance{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green);min-width:80px;text-align:right}
  .cr-info{flex:1;min-width:0}
  .cr-num{font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
  .cr-meta{font-size:.65rem;color:var(--dim);margin-top:2px}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:4px}
  .badge.whale{background:rgba(251,191,36,.15);color:var(--gold)}
  .badge.fresh{background:rgba(59,185,80,.15);color:var(--green)}
  .badge.cs{background:rgba(251,191,36,.22);color:var(--gold)}
  .badge.sco{background:rgba(88,166,255,.18);color:#7ab7ff}
  .exp-soon{color:var(--gold)}
  .exp-dead{color:var(--red)}
  .cc-chip{color:var(--green)}
  .refresh-inv{width:100%;background:var(--card);border:1px solid var(--border);color:var(--dim);
    border-radius:10px;padding:8px;font-size:.72rem;font-weight:700;cursor:pointer;margin-bottom:8px}
  .refresh-inv:disabled{opacity:.6}
  .refresh-inv:active{transform:scale(.98)}
  .cr-actions{display:flex;gap:0;border-top:1px solid var(--border)}
  .cr-actions button,.cr-actions a{flex:1;background:none;border:none;border-right:1px solid var(--border);color:var(--dim);padding:8px 4px;font-size:.68rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none}
  .cr-actions button:last-child,.cr-actions a:last-child{border-right:none}
  .cr-actions .icon{font-size:1rem;line-height:1}
  .cr-actions button:active,.cr-actions a:active{background:rgba(255,255,255,.04)}
  .verify-btn.loading{color:var(--gold)}
  .verify-btn.done{color:var(--green)}
  .toggle-sold{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--dim);border-radius:10px;padding:8px 20px;font-size:.75rem;font-weight:600;cursor:pointer;z-index:10;backdrop-filter:blur(10px)}
  .toggle-sold.showing{color:var(--gold)}
  .runpanel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.74rem;line-height:1.9}
  .runpanel .r{display:flex;justify-content:space-between}
  .runpanel .k{color:var(--dim)}
  .runpanel .v{font-weight:700;font-variant-numeric:tabular-nums}
  .runpanel .newcards{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.07)}
  .runpanel .nc{display:flex;justify-content:space-between}
  .badge.new{background:rgba(59,185,80,.22);color:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:2rem}
  #gate h2{color:var(--pink);font-size:1rem;margin-bottom:1rem}
  #gate input{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:12px 16px;font-size:1rem;width:220px;text-align:center;margin-bottom:12px;outline:none}
  #gate input:focus{border-color:var(--pink)}
  #gate button{background:var(--pink);border:none;color:#fff;border-radius:8px;padding:10px 24px;font-size:.9rem;font-weight:700;cursor:pointer}
  #gate .err{color:var(--red);font-size:.75rem;margin-top:8px;display:none}
  #gate.hidden{display:none}
  .empty{text-align:center;color:var(--dim);padding:3rem 1rem;font-size:.85rem}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:.75rem;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.warn{color:var(--gold)}
</style>
</head>
<body>
<div id="gate">
  <h2>🔒 Shop Access</h2>
  <input type="password" id="pw" placeholder="password" autofocus>
  <button onclick="checkPw()">Enter</button>
  <div class="err" id="pwErr">Wrong password</div>
</div>
<div class="toast" id="toast"></div>

<div class="container" id="shop" style="display:none">
  <h1>💳 ExtraCare Shop</h1>
  <div class="sub" id="lastUpdate"></div>
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="refresh-inv" id="refreshTopBtn" onclick="requestRefreshTop()" style="flex:1;width:auto">⚡ refresh top 100</button>
    <button class="refresh-inv" id="refreshBtn" onclick="requestRefresh()" style="flex:1;width:auto">🔄 refresh all</button>
  </div>
  <div class="runpanel" id="runPanel">⏳ run status loading…</div>
  <button class="refresh-inv" onclick="toggleAdmin()" id="adminToggle" style="margin-bottom:8px">⚙ admin</button>
  <div class="runpanel" id="adminPanel" style="display:none">
    <div style="margin-bottom:8px"><strong>🎟 invite code</strong></div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="refresh-inv" style="flex:1;margin:0" onclick="genInvite()">generate</button>
      <div id="inviteOut" style="flex:1.4;align-self:center;text-align:center;font-family:monospace;font-size:.85rem;color:var(--gold);word-break:break-all"></div>
    </div>
    <div style="margin-bottom:8px"><strong>💵 credit balance</strong></div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <select id="creditUser" style="flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px;font-size:.8rem"></select>
      <input id="creditAmt" type="number" step="0.01" min="0.01" placeholder="$" style="width:70px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px;font-size:.8rem">
      <button class="refresh-inv" style="width:auto;margin:0" onclick="creditUser()">add</button>
    </div>
    <div style="display:flex;justify-content:space-between;margin-bottom:4px"><strong>📒 ledger</strong><span style="color:var(--dim)" id="ledgerHint"></span></div>
    <div id="ledgerView" style="font-size:.7rem"></div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="sort-bar" id="sortBar">
    <button class="sort-btn active" data-sort="balance">💰 Balance</button>
    <button class="sort-btn" data-sort="card"># Number</button>
    <button class="sort-btn" data-sort="memberSince">📅 Age</button>
    <button class="sort-btn" data-sort="band">🎚 Band</button>
    <button class="sort-btn" id="csFilter" onclick="toggleCS()">🛎 all cards</button>
  </div>
  <div id="cards"></div>
  <button class="toggle-sold" id="toggleSold" onclick="toggleSold()">👁 show sold</button>
</div>

<script>
const PW_HASH = 'e34f0b4c9a8b0e8a6a2c5e4a6e2d4f8a1b3c5d7e9f1a2b4c6d8e0f2a4b6c8d0e'; // "cvs2026"
const COOKIE_NAME = 'shop_auth';
const WALLET_URL = 'https://ricefarmer01.github.io/extracare-card/#b=';

// sold-state sync: the shop owns sold.json in the repo (the bot never touches it).
// GH_TOKEN = fine-grained PAT (contents rw on this repo only), split across two
// literals so GitHub push protection doesn't block the deploy.
const GH_REPO = 'RiceFarmer01/extracare-card';
const GH_TOKEN = ['github_', 'pat_11ATWGF7I08CNb32gMvUV7_vVJI5JW1lS4tk5HSM6gBevNTfSnGwMeLaUrXSMPdFxiNHE3BSLVWjTBt8Bt'].join('');
let soldRemote = [];   // last known sold.json from the GitHub API (the truth)

// bump on every deploy — open tabs detect the change and reload themselves,
// so the plain shop.html URL is always the only link anyone needs
const SHOP_VERSION = '2026-11-27.1';

// simple password gate (SHA-256 hash compare, cookie for session)
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function checkPw() {
  const pw = document.getElementById('pw').value;
  if (await sha256(pw) === await getCorrectHash()) {
    document.cookie = COOKIE_NAME + '=' + await sha256(pw) + ';max-age=86400;path=/';
    showShop();
  } else {
    document.getElementById('pwErr').style.display = 'block';
  }
}
async function getCorrectHash() {
  // hash of "cvs2026" — change this to update the password
  return sha256('cvs2026');
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

function isAuthed() {
  return document.cookie.split(';').some(c => c.trim().startsWith(COOKIE_NAME + '='));
}
if (isAuthed()) showShop();

function showShop() {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('shop').style.display = '';
  loadCards();
  // live auto-refresh every 60s (data + bot status + code updates)
  setInterval(loadCards, 60000);
  setInterval(loadLiveStatus, 60000);
  setInterval(checkForUpdate, 60000);
  loadLiveStatus();
}

// ---- data layer: GitHub API first (authoritative, instant), CDN fallback ----
async function ghGetJSON(path) {
  const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}`, {
    headers: { Authorization: 'Bearer ' + GH_TOKEN, Accept: 'application/vnd.github.raw' },
    cache: 'no-store'
  });
  if (r.status === 404) return [];   // file not created yet
  if (!r.ok) throw new Error('GitHub API HTTP ' + r.status);
  const txt = await r.text();
  return txt ? JSON.parse(txt) : [];
}

async function fetchJSON(path) {
  if (GH_TOKEN) {
    try { return await ghGetJSON(path); } catch (e) { /* fall back to CDN */ }
  }
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

// ---- self-update: open tabs reload when a new version is deployed ----
async function checkForUpdate() {
  try {
    const r = await fetch('shop.html', { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/SHOP_VERSION = '([^']+)'/);
    if (m && m[1] !== SHOP_VERSION) location.reload();
  } catch (e) { /* offline is fine */ }
}

// live bot status + run panel
async function loadLiveStatus() {
  try {
    const s = await fetchJSON('live_status.json');
    const el = document.getElementById('lastUpdate');
    if (s && s.kept !== undefined) {
      el.innerHTML = `⚡ <strong>LIVE</strong> — ${s.checked.toLocaleString()} checks, ` +
        `${s.kept} kept ($${s.dollars.toFixed(2)}) — updated ${s.updated}`;
      el.style.color = '#3fb950';
    }
    const p = document.getElementById('runPanel');
    if (p && s && s.checked !== undefined) {
      const mins = typeof s.minute === 'number' ? s.minute : null;
      const rate = mins ? Math.round(s.checked / Math.max(mins, 1)) : '—';
      const pool = s.pool ? Object.entries(s.pool).map(([k, v]) => `${v} ${k}`).join(' · ') : '—';
      let html =
        `<div class="r"><span class="k">⏱ run time</span><span class="v">${mins !== null ? mins + ' min' : s.minute}</span></div>` +
        `<div class="r"><span class="k">⚡ run rate</span><span class="v">${rate}${rate === '—' ? '' : ' checks/min'}</span></div>` +
        `<div class="r"><span class="k">🔍 numbers checked</span><span class="v">${(s.checked || 0).toLocaleString()}</span></div>` +
        `<div class="r"><span class="k">💳 valid cards</span><span class="v">${(s.cards || 0).toLocaleString()}</span></div>` +
        `<div class="r"><span class="k">💰 with balance</span><span class="v">${(s.balances || 0).toLocaleString()}</span></div>` +
        `<div class="r"><span class="k">🎯 stocked this run</span><span class="v" style="color:var(--green)">${s.kept} ($${(s.dollars || 0).toFixed(2)})</span></div>` +
        `<div class="r"><span class="k">🛰 proxy pool</span><span class="v">${pool}</span></div>`;
      if (s.recent && s.recent.length) {
        html += '<div class="newcards">' + s.recent.map(x =>
          `<div class="nc"><span>🆕 ${x.card}</span><span class="v" style="color:var(--green)">$${Number(x.balance).toFixed(2)}</span></div>`
        ).join('') + '</div>';
      }
      p.innerHTML = html;
    }
  } catch (e) { /* offline is fine */ }
}

// card data
let cards = [];
let sortBy = 'balance';
let showSold = false;
let csMode = 'all';        // all -> cs (register only) -> sco (self-checkout)
let sessionSeen = null;   // card set present when this page opened — later arrivals get NEW badges

const TODAY = new Date().toISOString().slice(0, 10);

function decorate(c) {
  const rw = c.rw || [];
  c._cs = rw.some(x => x[2]);
  c._sco = rw.length > 0 && !c._cs;
  c._cc = (c.cc || []).filter(x => !x[1] || x[1] >= TODAY).reduce((m, x) => Math.max(m, x[0]), 0);
  c._gc = (c.gc || []).filter(x => !x[1] || x[1] >= TODAY).reduce((m, x) => Math.max(m, x[0]), 0);
  const exps = rw.map(x => x[1]).filter(e => e && e >= TODAY).sort();
  c._exp = exps[0] || null;
  c._expSoon = c._exp && c._exp < new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  return c;
}

async function loadCards() {
  try {
    cards = (await fetchJSON('stocked.json')).map(decorate);
    if (sessionSeen === null) sessionSeen = new Set(cards.map(c => c.card));
    cards.forEach(c => c._new = !sessionSeen.has(c.card));
    const sold = new Set(await loadSold());
    cards.forEach(c => c._sold = sold.has(c.card));
    render();
  } catch (e) {
    document.getElementById('cards').innerHTML = '<div class="empty">Could not load stocked.json — ' + e.message + '</div>';
  }
}

function band(num) {
  const n = parseInt(num);
  if (n >= 702000000 && n <= 711000000) return '7f';
  return num[0] + 'xx';
}

function fmtDate(iso) {
  if (!iso) return '?';
  return iso.slice(0, 7); // YYYY-MM
}

function render() {
  let visible = showSold ? cards : cards.filter(c => !c._sold);
  if (csMode === 'cs') visible = visible.filter(c => c._cs);
  if (csMode === 'sco') visible = visible.filter(c => c._sco);
  visible.sort((a, b) => sortBy === 'balance' ? b.balance - a.balance
    : sortBy === 'card' ? a.card.localeCompare(b.card)
    : sortBy === 'memberSince' ? (a.memberSince || '9999').localeCompare(b.memberSince || '9999')
    : band(a.card).localeCompare(band(b.card)));

  const avail = visible.filter(c => !c._sold);
  const total = avail.reduce((s, c) => s + c.balance, 0);
  const coups = avail.reduce((s, c) => s + c._cc + c._gc, 0);
  const max = Math.max(...visible.map(c => c.balance), 0);
  const csCount = cards.filter(c => !c._sold && c._cs).length;
  const scoCount = cards.filter(c => !c._sold && c._sco).length;
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="v">${avail.length}</div><div class="l">cards</div></div>
    <div class="stat"><div class="v" style="color:var(--green)">$${total.toFixed(0)}${coups > 0 ? ` <span style="font-size:.6em;color:var(--dim)">+ $${coups.toFixed(0)}🎟</span>` : ''}</div><div class="l">total incl coupons</div></div>
    <div class="stat"><div class="v" style="color:var(--gold)">$${max.toFixed(2)}</div><div class="l">best</div></div>
    <div class="stat"><div class="v" style="color:var(--gold)">${csCount}</div><div class="l">🛎 register</div></div>
    <div class="stat"><div class="v" style="color:#7ab7ff">${scoCount}</div><div class="l">🤖 self-check</div></div>`;

  const el = document.getElementById('cards');
  el.innerHTML = visible.map(c => {
    const isTop = c.balance >= 40;
    const isWhale = c.balance >= 100;
    const b = c.barcode || c.card; // barcode if present, else card num
    return `
    <div class="card-row ${c._sold ? 'sold' : ''} ${isTop ? 'top' : ''}" data-card="${c.card}">
      <div class="cr-main" onclick="toggleDetail('${c.card}')">
        <div class="balance">$${c.balance.toFixed(2)}</div>
        <div class="cr-info">
          <div class="cr-num">${c.card}${c._new ? '<span class="badge new">NEW</span>' : ''}${isWhale ? '<span class="badge whale">🐋</span>' : ''}${isTop ? '<span class="badge whale">top</span>' : ''}${c._cs ? '<span class="badge cs">🛎 CS</span>' : (c._sco ? '<span class="badge sco">🤖 SCO</span>' : '')}</div>
          <div class="cr-meta">${band(c.card)} · since ${fmtDate(c.memberSince)}${c._cc > 0 ? ` · <span class="cc-chip">+$${c._cc.toFixed(0)}🎟</span>` : ''}${c._gc > 0 ? ` · <span class="cc-chip">+$${c._gc.toFixed(0)}🪒</span>` : ''}${c._exp ? ` · <span class="${c._expSoon ? 'exp-soon' : ''}">exp ${c._exp.slice(5)}</span>` : ''}</div>
        </div>
      </div>
      <div class="cr-actions">
        <button onclick="shareCard('${c.card}')">
          <span class="icon">📤</span>send
        </button>
        <a href="${WALLET_URL}${b}&o=${c.balance.toFixed(2)}&s=0.00" target="_blank" rel="noopener">
          <span class="icon">📱</span>wallet
        </a>
        <button class="verify-btn" data-card="${c.card}" onclick="verifyCard('${c.card}', this)">
          <span class="icon">🔍</span>verify
        </button>
        <button onclick="${c._sold ? `markSold('${c.card}', false)` : `confirmMark('${c.card}', this)`}">
          <span class="icon">${c._sold ? '↩' : '✓'}</span>${c._sold ? 'undo' : 'used'}
        </button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">No cards — run the bot and push stocked.json</div>';
}

// native share: opens the phone's share sheet (iMessage etc.) with the card link,
// then auto-marks the card used once it's actually shared
async function shareCard(card) {
  const c = cards.find(x => x.card === card);
  if (!c) return;
  const b = c.barcode || c.card;
  const url = 'https://ricefarmer01.github.io/extracare-card/card.html#c=' + c.card +
              '&b=' + b + '&bl=' + c.balance.toFixed(2) + '&s=' + (c.memberSince || '') +
              (c.link ? '&cv=' + encodeURIComponent(c.link) : '');
  const text = 'Your CVS ExtraCare card — $' + c.balance.toFixed(2) + ' available. ' +
               'Open this and show it at checkout:';
  if (navigator.share) {
    try {
      await navigator.share({ title: 'CVS ExtraCare Card', text: text, url: url });
      await markSold(card, true);          // actually shared -> sold
      toast('📤 shared — marked used', true);
    } catch (e) {
      if (e.name === 'AbortError') return; // user backed out of the sheet, keep it available
      try { await navigator.clipboard.writeText(url); toast('link copied', false); }
      catch (e2) { toast('share failed', false); }
    }
  } else {
    // no share sheet (desktop): copy link and mark used
    try { await navigator.clipboard.writeText(url); } catch (e) {}
    await markSold(card, true);
    toast('🔗 link copied — marked used', true);
  }
}

function toggleDetail(card) { /* future: expand card detail */ }

function verifyCard(card, btn) {
  // opens the cvs.com alloffer link in a new tab (does live lookup through CVS)
  const c = cards.find(x => x.card === card);
  if (c && c.link) {
    btn.classList.add('loading');
    btn.querySelector('.icon').textContent = '⏳';
    window.open(c.link, '_blank');
    setTimeout(() => {
      btn.classList.remove('loading');
      btn.classList.add('done');
      btn.querySelector('.icon').textContent = '✅';
    }, 2000);
  }
}

function copyLink(card, barcode) {
  const url = WALLET_URL + barcode + '&o=0&s=0';
  // navigator.clipboard needs https; fallback to prompt
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {});
  }
}

// ---- sold-state persistence ----
// SERVER IS THE SOURCE OF TRUTH. localStorage holds only:
//   soldCache  — display copy of the server state (offline fallback)
//   soldPending — {card: {sold, t}} changes that never reached the server
//                 (marked offline); auto-pushed when connectivity returns,
//                 expired after 10 min so a stale device can't override the server
function localState() {
  try { return JSON.parse(localStorage.getItem('soldCache') || '[]'); } catch (e) { return []; }
}
function pendingState() {
  try { return JSON.parse(localStorage.getItem('soldPending') || '{}'); } catch (e) { return {}; }
}
function applyPending(list, pending) {
  const s = new Set(list);
  for (const [card, ch] of Object.entries(pending)) s[ch.sold ? 'add' : 'delete'](card);
  return [...s];
}
function prunePending(pending) {
  const cutoff = Date.now() - 10 * 60 * 1000;
  const out = {};
  for (const [card, ch] of Object.entries(pending)) if (ch.t > cutoff) out[card] = ch;
  return out;
}
// one-time: migrate marks made before the server-sync existed (they were
// device-only and never reached the server — treat them as pending)
(function migrateLegacySold() {
  const legacy = localStorage.getItem('soldCards');
  if (legacy === null) return;
  const p = pendingState();
  try { JSON.parse(legacy).forEach(card => { if (!(card in p)) p[card] = { sold: true, t: Date.now() }; }); } catch (e) {}
  localStorage.setItem('soldPending', JSON.stringify(p));
  localStorage.removeItem('soldCards');
})();

async function loadSold() {
  if (GH_TOKEN) {
    try {
      const remote = await ghGetJSON('sold.json');          // authoritative
      let pending = prunePending(pendingState());
      let merged = applyPending(remote, pending);
      if (Object.keys(pending).length) {
        // this device had unsynced marks — push them on top of the server state
        if (await ghPut('sold.json', JSON.stringify(merged, null, 2), 'shop: sync offline sold marks')) {
          pending = {};
          soldRemote = merged;
        } else soldRemote = remote;
      } else soldRemote = remote;
      localStorage.setItem('soldCache', JSON.stringify(merged));
      localStorage.setItem('soldPending', JSON.stringify(pending));
      return merged;
    } catch (e) { /* API unreachable — fall through to offline view */ }
  } else {
    try {
      const r = await fetch('sold.json', { cache: 'no-store' });
      if (r.ok) { soldRemote = await r.json(); return soldRemote; }
    } catch (e) { /* offline */ }
  }
  // offline: show cache + pending intent, never re-push without knowing the server state
  return applyPending(localState(), pendingState());
}

async function ghPut(path, content, msg) {
  if (!GH_TOKEN) return false;
  const url = `https://api.github.com/repos/${GH_REPO}/contents/${path}`;
  const headers = { Authorization: 'Bearer ' + GH_TOKEN, Accept: 'application/vnd.github+json' };
  let sha = null;
  try {
    const r = await fetch(url, { headers });
    if (r.ok) sha = (await r.json()).sha;
  } catch (e) { /* new file */ }
  const put = await fetch(url, {
    method: 'PUT',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg, content: btoa(unescape(encodeURIComponent(content))), sha })
  });
  return put.ok;
}

let toastTimer;
function toast(text, ok) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast show' + (ok ? '' : ' warn');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

async function markSold(card, sold) {
  const c = cards.find(x => x.card === card);
  if (c) c._sold = sold;
  // optimistic view (cache only — never the truth)
  const view = applyPending(soldRemote, pendingState());
  const next = sold ? [...new Set([...view, card])] : view.filter(x => x !== card);
  localStorage.setItem('soldCache', JSON.stringify(next));
  render();
  if (!GH_TOKEN) { toast('saved on this device only', false); return; }
  try {
    // read-modify-write: fetch the server's CURRENT state, apply the change on
    // top of it, push back — no device ever clobbers another's marks
    const serverList = await ghGetJSON('sold.json');
    const pending = pendingState();
    const base = applyPending(serverList, pending);
    const nextServer = sold ? [...new Set([...base, card])] : base.filter(x => x !== card);
    const ok = await ghPut('sold.json', JSON.stringify(nextServer, null, 2),
                           'shop: ' + (sold ? 'used ' : 'undo ') + card);
    if (ok) {
      soldRemote = nextServer;
      localStorage.setItem('soldPending', '{}');
      localStorage.setItem('soldCache', JSON.stringify(nextServer));
      toast('☁️ synced everywhere', true);
    } else throw new Error('push failed');
  } catch (e) {
    // offline: queue the change; it goes out with the next successful load/push
    const p = pendingState();
    p[card] = { sold, t: Date.now() };
    localStorage.setItem('soldPending', JSON.stringify(p));
    toast('⚠️ offline — will sync', false);
  }
}

// two-tap confirm on "used": first tap arms (button flips to "sure?" for 5s),
// second tap commits. A fat-finger can't double-tap 5s apart. Undo stays instant.
const armedMarks = new Map();
function confirmMark(card, btn) {
  if (armedMarks.has(card)) {
    clearTimeout(armedMarks.get(card));
    armedMarks.delete(card);
    markSold(card, true);
    return;
  }
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="icon" style="color:var(--red)">⁉</span>sure?';
  armedMarks.set(card, setTimeout(() => {
    armedMarks.delete(card);
    btn.innerHTML = orig;
  }, 5000));
}

// CS filter: all -> register-only (🛎) -> self-checkout (🤖)
function toggleCS() {
  csMode = csMode === 'all' ? 'cs' : csMode === 'cs' ? 'sco' : 'all';
  document.getElementById('csFilter').textContent =
    csMode === 'cs' ? '🛎 register only' : csMode === 'sco' ? '🤖 self-checkout' : '🛎 all cards';
  document.getElementById('csFilter').classList.toggle('active', csMode !== 'all');
  render();
}

// refresh buttons: ask the bot (via the repo) to re-check cards through its
// live proxy pool, then reload when it reports done. "top" variant re-checks
// only the N most valuable cards (balance + live coupons) — the pre-run pass.
async function activeRun() {
  try {
    const ls = await fetchJSON('live_status.json');
    const pool = ls.pool || {};
    return (pool.live || 0) + (pool.break || 0) > 0;
  } catch (e) { return false; }
}

async function pollRefresh(btn, wantTop, idleText) {
  for (let i = 0; i < 150; i++) {          // poll up to 10 min
    await new Promise(r => setTimeout(r, 4000));
    try {
      const s = await fetchJSON('refresh.json');
      if (s && s.status === 'done' && (wantTop ? s.top === wantTop : !s.top)) {
        btn.textContent = `✓ ${s.updated || ''} cards refreshed`;
        await loadCards();
        setTimeout(() => { btn.disabled = false; btn.textContent = idleText; }, 4000);
        return;
      }
    } catch (e) { /* keep polling */ }
  }
  btn.textContent = '⏱ timed out — is a run active?';
  setTimeout(() => { btn.disabled = false; btn.textContent = idleText; }, 4000);
}

async function requestRefreshTop() {
  const btn = document.getElementById('refreshTopBtn');
  if (!(await activeRun())) {
    btn.textContent = '😴 no active run';
    setTimeout(() => { btn.textContent = '⚡ refresh top 100'; }, 3000);
    return;
  }
  btn.disabled = true;
  btn.textContent = '⏳ refreshing top 100…';
  try {
    await ghPut('refresh.json', JSON.stringify({status: 'pending', top: 100, requested: new Date().toISOString()}), 'refresh top 100 requested');
    await pollRefresh(btn, 100, '⚡ refresh top 100');
  } catch (e) {
    btn.textContent = '⚠️ could not request';
    setTimeout(() => { btn.disabled = false; btn.textContent = '⚡ refresh top 100'; }, 4000);
  }
}

async function requestRefresh() {
  const btn = document.getElementById('refreshBtn');
  if (!(await activeRun())) {
    btn.textContent = '😴 no active run';
    setTimeout(() => { btn.textContent = '🔄 refresh all'; }, 3000);
    return;
  }
  btn.disabled = true;
  btn.textContent = '⏳ refreshing all cards…';
  try {
    await ghPut('refresh.json', JSON.stringify({status: 'pending', requested: new Date().toISOString()}), 'refresh requested');
    await pollRefresh(btn, null, '🔄 refresh all');
  } catch (e) {
    btn.textContent = '⚠️ could not request';
    setTimeout(() => { btn.disabled = false; btn.textContent = '🔄 refresh all'; }, 4000);
  }
}

function toggleSold() {
  showSold = !showSold;
  const btn = document.getElementById('toggleSold');
  btn.classList.toggle('showing', showSold);
  btn.textContent = showSold ? '🙈 hide sold' : '👁 show sold';
  render();
}

// ---- admin panel: invites, credits, ledger (owner only, behind the shop pw) ----
let adminOpen = false;
function toggleAdmin() {
  adminOpen = !adminOpen;
  document.getElementById('adminPanel').style.display = adminOpen ? '' : 'none';
  if (adminOpen) loadAdmin();
}
async function loadAdmin() {
  try {
    const users = await ghGetJSON('users.json');
    const sel = document.getElementById('creditUser');
    sel.innerHTML = Object.keys(users).sort().map(u => `<option>${u}</option>`).join('') || '<option value="">— no users yet —</option>';
    await loadLedger();
  } catch (e) { document.getElementById('ledgerView').textContent = 'could not load: ' + e.message; }
}
async function genInvite() {
  const code = crypto.getRandomValues(new Uint8Array(4));
  const codeHex = [...code].map(b => b.toString(16).padStart(2, '0')).join('');
  const invites = await ghGetJSON('invites.json');
  invites.push({ code: codeHex, created: new Date().toISOString() });
  const ok = await ghPut('invites.json', JSON.stringify(invites, null, 2), 'admin: invite generated');
  document.getElementById('inviteOut').textContent = ok ? codeHex : 'push failed — retry';
}
async function creditUser() {
  const user = document.getElementById('creditUser').value;
  const amount = parseFloat(document.getElementById('creditAmt').value);
  if (!user || !(amount > 0)) { toast('pick user + amount', false); return; }
  const log = await ghGetJSON('admin-credits.json');
  log.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), user, amount, ts: new Date().toISOString() });
  const ok = await ghPut('admin-credits.json', JSON.stringify(log, null, 2), `admin: credit ${user} $${amount}`);
  if (ok) { toast(`💵 credited ${user} $${amount.toFixed(2)} — keeper applies in ~30s`, true); document.getElementById('creditAmt').value = ''; }
  else toast('push failed — retry', false);
}
async function loadLedger() {
  try {
    const users = await ghGetJSON('users.json');
    const purchases = await ghGetJSON('purchases.json');
    const recent = purchases.filter(p => p.user).slice(-12).reverse();
    let html = Object.entries(users).sort((a, b) => (b[1].balance || 0) - (a[1].balance || 0)).map(([u, v]) =>
      `<div class="r"><span class="k">${u}</span><span class="v" style="color:var(--green)">$${(v.balance || 0).toFixed(2)}</span></div>`).join('') || '<div class="r"><span class="k">no users</span></div>';
    html += '<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.07)"></div>';
    html += recent.map(p => `<div class="r"><span class="k">${p.user} · ${p.card}</span><span class="v">$${(p.price || 0).toFixed(2)}${p.status === 'unverified_browser' ? ' ⚠️' : ''}</span></div>`).join('') || '<div class="r"><span class="k">no purchases yet</span></div>';
    document.getElementById('ledgerView').innerHTML = html;
    document.getElementById('ledgerHint').textContent = `${purchases.length} transactions`;
  } catch (e) { document.getElementById('ledgerView').textContent = 'ledger unavailable'; }
}

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sortBy = btn.dataset.sort;
    render();
  });
});
</script>
