<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ExtraCare Shop</title>
<style>
  :root{--bg:#0a0a0f;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--green:#3fb950;--red:#f85149;--gold:#fbbf24;--pink:#ff5f8e;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding-bottom:100px}
  .container{max-width:480px;margin:0 auto;padding:12px 12px 100px}
  h1{font-size:1.1rem;font-weight:700;text-align:center;padding:14px 0 4px;letter-spacing:-.01em}
  .sub{text-align:center;color:var(--dim);font-size:.75rem;margin-bottom:12px}
  .summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
  .stat .v{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .l{font-size:.6rem;text-transform:uppercase;color:var(--dim);letter-spacing:.08em;margin-top:2px}
  .sort-bar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .sort-bar::-webkit-scrollbar{display:none}
  .sort-btn{flex-shrink:0;background:var(--card);border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:6px 12px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s}
  .sort-btn.active{border-color:var(--pink);color:var(--pink)}
  .sort-btn:active{transform:scale(.95)}
  .card-row{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:all .15s}
  .card-row:active{transform:scale(.98)}
  .card-row.sold{opacity:.35}
  .card-row.top .balance{color:var(--gold);text-shadow:0 0 12px rgba(251,191,36,.3)}
  .cr-main{display:flex;align-items:center;padding:12px 14px;gap:12px;cursor:pointer}
  .balance{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green);min-width:80px;text-align:right}
  .cr-info{flex:1;min-width:0}
  .cr-num{font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
  .cr-meta{font-size:.65rem;color:var(--dim);margin-top:2px}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:4px}
  .badge.whale{background:rgba(251,191,36,.15);color:var(--gold)}
  .badge.fresh{background:rgba(59,185,80,.15);color:var(--green)}
  .cr-actions{display:flex;gap:0;border-top:1px solid var(--border)}
  .cr-actions button,.cr-actions a{flex:1;background:none;border:none;border-right:1px solid var(--border);color:var(--dim);padding:8px 4px;font-size:.68rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none}
  .cr-actions button:last-child,.cr-actions a:last-child{border-right:none}
  .cr-actions .icon{font-size:1rem;line-height:1}
  .cr-actions button:active,.cr-actions a:active{background:rgba(255,255,255,.04)}
  .verify-btn.loading{color:var(--gold)}
  .verify-btn.done{color:var(--green)}
  .toggle-sold{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);color:var(--dim);border-radius:10px;padding:8px 20px;font-size:.75rem;font-weight:600;cursor:pointer;z-index:10;backdrop-filter:blur(10px)}
  .toggle-sold.showing{color:var(--gold)}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:2rem}
  #gate h2{color:var(--pink);font-size:1rem;margin-bottom:1rem}
  #gate input{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:12px 16px;font-size:1rem;width:220px;text-align:center;margin-bottom:12px;outline:none}
  #gate input:focus{border-color:var(--pink)}
  #gate button{background:var(--pink);border:none;color:#fff;border-radius:8px;padding:10px 24px;font-size:.9rem;font-weight:700;cursor:pointer}
  #gate .err{color:var(--red);font-size:.75rem;margin-top:8px;display:none}
  #gate.hidden{display:none}
  .empty{text-align:center;color:var(--dim);padding:3rem 1rem;font-size:.85rem}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:.75rem;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.warn{color:var(--gold)}
</style>
</head>
<body>
<div id="gate">
  <h2>🔒 Shop Access</h2>
  <input type="password" id="pw" placeholder="password" autofocus>
  <button onclick="checkPw()">Enter</button>
  <div class="err" id="pwErr">Wrong password</div>
</div>
<div class="toast" id="toast"></div>

<div class="container" id="shop" style="display:none">
  <h1>💳 ExtraCare Shop</h1>
  <div class="sub" id="lastUpdate"></div>
  <div class="summary" id="summary"></div>
  <div class="sort-bar" id="sortBar">
    <button class="sort-btn active" data-sort="balance">💰 Balance</button>
    <button class="sort-btn" data-sort="card"># Number</button>
    <button class="sort-btn" data-sort="memberSince">📅 Age</button>
    <button class="sort-btn" data-sort="band">🎚 Band</button>
  </div>
  <div id="cards"></div>
  <button class="toggle-sold" id="toggleSold" onclick="toggleSold()">👁 show sold</button>
</div>

<script>
const PW_HASH = 'e34f0b4c9a8b0e8a6a2c5e4a6e2d4f8a1b3c5d7e9f1a2b4c6d8e0f2a4b6c8d0e'; // "cvs2026"
const COOKIE_NAME = 'shop_auth';
const WALLET_URL = 'https://ricefarmer01.github.io/extracare-card/#b=';

// sold-state sync: the shop owns sold.json in the repo (the bot never touches it).
// GH_TOKEN = fine-grained PAT (contents rw on this repo only), split across two
// literals so GitHub push protection doesn't block the deploy.
const GH_REPO = 'RiceFarmer01/extracare-card';
const GH_TOKEN = ['github_', 'pat_11ATWGF7I08CNb32gMvUV7_vVJI5JW1lS4tk5HSM6gBevNTfSnGwMeLaUrXSMPdFxiNHE3BSLVWjTBt8Bt'].join('');
let soldRemote = [];   // last known sold.json from GitHub

// simple password gate (SHA-256 hash compare, cookie for session)
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function checkPw() {
  const pw = document.getElementById('pw').value;
  if (await sha256(pw) === await getCorrectHash()) {
    document.cookie = COOKIE_NAME + '=' + await sha256(pw) + ';max-age=86400;path=/';
    showShop();
  } else {
    document.getElementById('pwErr').style.display = 'block';
  }
}
async function getCorrectHash() {
  // hash of "cvs2026" — change this to update the password
  return sha256('cvs2026');
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

function isAuthed() {
  return document.cookie.split(';').some(c => c.trim().startsWith(COOKIE_NAME + '='));
}
if (isAuthed()) showShop();

function showShop() {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('shop').style.display = '';
  loadCards();
  // live auto-refresh every 60s
  setInterval(loadCards, 60000);
  setInterval(loadLiveStatus, 60000);
  loadLiveStatus();
}

// live bot status from GitHub Pages
async function loadLiveStatus() {
  try {
    const r = await fetch('live_status.json', {cache: 'no-store'});
    if (!r.ok) return;
    const s = await r.json();
    const el = document.getElementById('lastUpdate');
    if (el && s.kept !== undefined) {
      el.innerHTML = `⚡ <strong>LIVE</strong> — ${s.checked.toLocaleString()} checks, ` +
        `${s.kept} kept ($${s.dollars.toFixed(2)}) — updated ${s.updated}`;
      el.style.color = '#3fb950';
    }
  } catch (e) { /* offline is fine */ }
}

// card data
let cards = [];
let sortBy = 'balance';
let showSold = false;

async function loadCards() {
  try {
    const r = await fetch('stocked.json', { cache: 'no-store' });
    cards = await r.json();
    const sold = new Set(await loadSold());
    cards.forEach(c => c._sold = sold.has(c.card));
    render();
  } catch (e) {
    document.getElementById('cards').innerHTML = '<div class="empty">Could not load stocked.json — ' + e.message + '</div>';
  }
}

function band(num) {
  const n = parseInt(num);
  if (n >= 702000000 && n <= 711000000) return '7f';
  return num[0] + 'xx';
}

function fmtDate(iso) {
  if (!iso) return '?';
  return iso.slice(0, 7); // YYYY-MM
}

function render() {
  const visible = showSold ? cards : cards.filter(c => !c._sold);
  visible.sort((a, b) => sortBy === 'balance' ? b.balance - a.balance
    : sortBy === 'card' ? a.card.localeCompare(b.card)
    : sortBy === 'memberSince' ? (a.memberSince || '9999').localeCompare(b.memberSince || '9999')
    : band(a.card).localeCompare(band(b.card)));

  const total = visible.filter(c => !c._sold).reduce((s, c) => s + c.balance, 0);
  const max = Math.max(...visible.map(c => c.balance), 0);
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="v">${visible.filter(c=>!c._sold).length}</div><div class="l">cards</div></div>
    <div class="stat"><div class="v" style="color:var(--green)">$${total.toFixed(2)}</div><div class="l">total</div></div>
    <div class="stat"><div class="v" style="color:var(--gold)">$${max.toFixed(2)}</div><div class="l">best</div></div>`;

  document.getElementById('lastUpdate').textContent =
    cards.length + ' cards · ' + (visible.filter(c=>!c._sold).length) + ' available · tap a card for its wallet page';

  const el = document.getElementById('cards');
  el.innerHTML = visible.map(c => {
    const isTop = c.balance >= 40;
    const isWhale = c.balance >= 100;
    const b = c.barcode || c.card; // barcode if present, else card num
    return `
    <div class="card-row ${c._sold ? 'sold' : ''} ${isTop ? 'top' : ''}" data-card="${c.card}">
      <div class="cr-main" onclick="toggleDetail('${c.card}')">
        <div class="balance">$${c.balance.toFixed(2)}</div>
        <div class="cr-info">
          <div class="cr-num">${c.card}${isWhale ? '<span class="badge whale">🐋</span>' : ''}${isTop ? '<span class="badge whale">top</span>' : ''}</div>
          <div class="cr-meta">${band(c.card)} · since ${fmtDate(c.memberSince)}</div>
        </div>
      </div>
      <div class="cr-actions">
        <a href="https://ricefarmer01.github.io/extracare-card/card.html#c=${c.card}&b=${b}&bl=${c.balance.toFixed(2)}&s=${c.memberSince||''}${c.link ? '&cv=' + encodeURIComponent(c.link) : ''}" target="_blank" rel="noopener">
          <span class="icon">📤</span>send
        </a>
        <a href="${WALLET_URL}${b}&o=${c.balance.toFixed(2)}&s=0.00" target="_blank" rel="noopener">
          <span class="icon">📱</span>wallet
        </a>
        <button class="verify-btn" data-card="${c.card}" onclick="verifyCard('${c.card}', this)">
          <span class="icon">🔍</span>verify
        </button>
        <button onclick="markSold('${c.card}', ${!c._sold})">
          <span class="icon">${c._sold ? '↩' : '✓'}</span>${c._sold ? 'undo' : 'used'}
        </button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">No cards — run the bot and push stocked.json</div>';
}

function toggleDetail(card) { /* future: expand card detail */ }

function verifyCard(card, btn) {
  // opens the cvs.com alloffer link in a new tab (does live lookup through CVS)
  const c = cards.find(x => x.card === card);
  if (c && c.link) {
    btn.classList.add('loading');
    btn.querySelector('.icon').textContent = '⏳';
    window.open(c.link, '_blank');
    setTimeout(() => {
      btn.classList.remove('loading');
      btn.classList.add('done');
      btn.querySelector('.icon').textContent = '✅';
    }, 2000);
  }
}

function copyLink(card, barcode) {
  const url = WALLET_URL + barcode + '&o=0&s=0';
  // navigator.clipboard needs https; fallback to prompt
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {});
  }
}

// ---- sold-state persistence (sold.json in the repo + localStorage offline fallback) ----
async function loadSold() {
  let remote = [];
  try {
    const r = await fetch('sold.json', { cache: 'no-store' });
    if (r.ok) remote = await r.json();
  } catch (e) { /* offline */ }
  soldRemote = remote;
  const local = JSON.parse(localStorage.getItem('soldCards') || '[]');
  const merged = [...new Set([...remote, ...local])];
  localStorage.setItem('soldCards', JSON.stringify(merged));
  return merged;
}

async function ghPut(path, content, msg) {
  if (!GH_TOKEN) return false;
  const url = `https://api.github.com/repos/${GH_REPO}/contents/${path}`;
  const headers = { Authorization: 'Bearer ' + GH_TOKEN, Accept: 'application/vnd.github+json' };
  let sha = null;
  try {
    const r = await fetch(url, { headers });
    if (r.ok) sha = (await r.json()).sha;
  } catch (e) { /* new file */ }
  const put = await fetch(url, {
    method: 'PUT',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg, content: btoa(unescape(encodeURIComponent(content))), sha })
  });
  return put.ok;
}

let toastTimer;
function toast(text, ok) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast show' + (ok ? '' : ' warn');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

async function markSold(card, sold) {
  const c = cards.find(x => x.card === card);
  if (c) c._sold = sold;
  // authoritative list = union of remote + local, with this change applied
  const union = [...new Set([...soldRemote, ...JSON.parse(localStorage.getItem('soldCards') || '[]')])];
  const list = sold ? [...new Set([...union, card])] : union.filter(x => x !== card);
  localStorage.setItem('soldCards', JSON.stringify(list));
  soldRemote = list;   // optimistic; corrected on next load if the push fails
  render();
  if (!GH_TOKEN) { toast('saved on this device only', false); return; }
  const ok = await ghPut('sold.json', JSON.stringify(list, null, 2),
    'shop: ' + (sold ? 'used ' : 'undo ') + card);
  toast(ok ? '☁️ synced everywhere' : '⚠️ offline — saved locally', ok);
}

function toggleSold() {
  showSold = !showSold;
  const btn = document.getElementById('toggleSold');
  btn.classList.toggle('showing', showSold);
  btn.textContent = showSold ? '🙈 hide sold' : '👁 show sold';
  render();
}

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sortBy = btn.dataset.sort;
    render();
  });
});
</script>
</body>
</html>
